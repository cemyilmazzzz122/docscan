name: Feature request
description: Suggest something DocScan should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation or problem, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: dropdown
    id: platform
    attributes:
      label: Platforms
      multiple: true
      options:
        - Android
        - iOS
        - Linux desktop
        - Engine
