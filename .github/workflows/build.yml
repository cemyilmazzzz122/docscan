name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'
  OPENCV_VERSION: '5.0.0'

jobs:
  engine:
    name: C++ engine (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev ninja-build
      - name: Build engine and CLI
        run: |
          cmake -S engine/src -B build/engine -G Ninja -DCMAKE_BUILD_TYPE=Release -DDOCSCAN_CLI=ON
          cmake --build build/engine
      - name: Smoke test
        run: |
          python3 - <<'PY'
          import struct, zlib
          # A light gray page on a dark background, written as a minimal PNG
          w, h = 800, 1000
          rows = []
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  inside = 150 < x < 650 and 120 < y < 880
                  row += bytes([235, 235, 235] if inside else [40, 45, 50])
              rows.append(bytes(row))
          raw = zlib.compress(b''.join(rows))
          def chunk(t, d): return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', raw) + chunk(b'IEND', b'')
          open('page.png', 'wb').write(png)
          PY
          ./build/engine/docscan-cli --corners page.png out.jpg | tee result.txt
          grep -q "^document:" result.txt

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: engine/third_party/OpenCV-android-sdk
          key: opencv-android-${{ env.OPENCV_VERSION }}
      - run: scripts/fetch_opencv.sh android
      - run: flutter pub get
      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
      - name: Collect
        run: |
          mkdir -p dist
          cd build/app/outputs/flutter-apk
          cp app-release.apk ../../../../dist/DocScan-universal.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do cp app-$abi-release.apk ../../../../dist/DocScan-$abi.apk; done
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: engine/ios/opencv2.framework
          key: opencv-ios-${{ env.OPENCV_VERSION }}
      - run: scripts/fetch_opencv.sh ios
      - run: flutter pub get
      - name: Build
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qr DocScan-unsigned.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "DocScan ${{ github.ref_name }}" --generate-notes
