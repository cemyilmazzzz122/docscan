name: docscan_engine
description: "DocScan's native C++ scanning engine (OpenCV), exposed to Dart through FFI."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
