# Native iOS app (SwiftUI, Liquid Glass). Generate the Xcode project with XcodeGen:
#
#   scripts/fetch_opencv.sh ios
#   xcodegen generate --spec ios-native/project.yml
#   open ios-native/DocScan.xcodeproj
name: DocScan
options:
  bundleIdPrefix: dev.docscan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  DocScan:
    type: application
    platform: iOS
    sources:
      - path: DocScan
      # The C++ engine, compiled straight into the app
      - path: ../engine/src
        excludes:
          - CMakeLists.txt
    dependencies:
      # Static framework from scripts/fetch_opencv.sh ios
      - framework: ../engine/ios/opencv2.framework
        embed: false
      - sdk: Accelerate.framework
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: QuartzCore.framework
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.docscan.docscan
        PRODUCT_NAME: DocScan
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: DocScan/App/DocScan-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../engine/src
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GCC_OPTIMIZATION_LEVEL: "3"
        # The prebuilt OpenCV framework has no arm64 simulator slice
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DocScan
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: DocScan uses the camera to photograph documents.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: DocScan opens photos of documents from your library.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: DocScan saves scanned pages to your library.
